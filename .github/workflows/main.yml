name: Build, Test, and Deploy to ACR, AKS, and Azure Function

on:
  push:
    branches: [ main ]

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_TAG: ${{ github.sha }}
  RESOURCE_GROUP: personalproject
  CLUSTER_NAME: aks-personalproject-dev
  WEBAPI_IMAGE_NAME: weatherforecast-webapi
  FUNCTION_IMAGE_NAME: weatherforecast-function
  FUNCTION_APP_NAME: weatherforecastfunction
  FUNCTION_DOCKERFILE_PATH: WeatherForecast.Function/Dockerfile

jobs:
  build-push-api:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧪 Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🛠️ Restore dependencies
        run: dotnet restore ./WeatherForecast/WeatherForecast.sln

      - name: 🧪 Run unit tests
        run: dotnet test ./WeatherForecast.Domain.UnitTests/WeatherForecast.Domain.UnitTests.csproj --no-build --verbosity normal

      - name: 🚀 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_AKS }}

      - name: 🔑 Get connection string from Azure Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: personalprjctkv
          secrets: 'WeatherForecastConnectionString'
        id: get-secret

      # - name: 🔄 Replace connection string in appsettings.json
      #   run: |
      #     $connRaw = @'
      #     ${{ steps.get-secret.outputs.WeatherForecastConnectionString }}
      #     '@
      #         # Escape inner double quotes for JSON
      #         $connEscaped = $connRaw -replace '"', '\"'
      #         $jsonPath = "WeatherForecast/appsettings.json"
      #         $json = Get-Content -Raw -Path $jsonPath | ConvertFrom-Json
      #         $json.ConnectionStrings.WeatherForecast = $connEscaped
      #         $json | ConvertTo-Json -Depth 10 | Set-Content -Path $jsonPath -Encoding UTF8
      #   shell: pwsh 

      - name: 🛠️ Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: 🔧 Install kubelogin 
        run: az aks install-cli  

      - name: 👥 Get AKS Credentials
        run: |
          mkdir -p $HOME/.kube
          export KUBECONFIG=$HOME/.kube/config
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CLUSTER_NAME }} \
            --overwrite-existing 
          echo "✅ kubeconfig written to: $KUBECONFIG"
          kubectl config get-contexts
          kubectl config current-context     

      - name: 🔐 Login to ACR
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: 🐳 Build and Push Docker Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.WEBAPI_IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.WEBAPI_IMAGE_NAME }}:${{ env.IMAGE_TAG }}      
      
      - name: 📝 Replace image tag in deployment.yaml
        run: |
          sed -i "s|weatherforecast-webapi:latest|weatherforecast-webapi:${{ env.IMAGE_TAG }}|g" deploy/deployment.yaml
          sed -i "s|personalproject.azurecr.io|${{ env.ACR_LOGIN_SERVER }}|g" deploy/deployment.yaml

      - name: 🚀 Deploy to AKS
        run: |
          export KUBECONFIG=$HOME/.kube/config
          kubectl apply -f deploy/deployment.yaml


  deploy-sql:
    runs-on: windows-latest
    
    env:
      SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
      SQL_DB: ${{ secrets.AZURE_SQL_DB }}
      SQL_USER: sravan4262
      SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
     
    - name: 🛠️ Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: 📦 Build SQL Project
      run: msbuild WeatherForecast_DB/WeatherForecast_DB/WeatherForecast_DB.sqlproj /p:Configuration=Release

    - name: Download and run SqlPackage
      run: |
        Invoke-WebRequest -Uri https://aka.ms/sqlpackage-windows -OutFile sqlpackage.zip
        Expand-Archive -LiteralPath sqlpackage.zip -DestinationPath sqlpackage
        .\sqlpackage\sqlpackage.exe /Action:Publish `
          /SourceFile:"WeatherForecast_DB\WeatherForecast_DB\bin\Release\WeatherForecast_DB.dacpac" `
          /TargetServerName:"$env:SQL_SERVER" `
          /TargetDatabaseName:"$env:SQL_DB" `
          /TargetUser:"$env:SQL_USER" `
          /TargetPassword:"$env:SQL_PASSWORD" `
          /p:BlockOnPossibleDataLoss=false
      shell: powershell

  

  build-push-and-deploy-function:
    runs-on: ubuntu-latest    
    
    env:
      # Function App Specific Environment Variables
      FUNCTION_APP_NAME: weatherforecastfunction # Your Azure Function App name
      FUNCTION_APP_RESOURCE_GROUP: personalproject # Your Function App's resource group
      FUNCTION_DOCKERFILE_PATH: WeatherForecast.Function/Dockerfile # Path to your Function's Dockerfile
      FUNCTION_IMAGE_NAME: weatherforecast-function
      IMAGE_TAG: latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # --- Azure Login for Function App Job (using OpenID Connect) ---
      # This login is also sufficient for ACR authentication if configured correctly
      - name: 🚀 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: az acr login --name personalproject    

      # 🏗️ Build the Docker image for the Function App
      - name: 🛠️ Build Function App Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/$FUNCTION_IMAGE_NAME:$IMAGE_TAG \
            -f WeatherForecast.Function/WeatherForecast.Function/Dockerfile \
            ./WeatherForecast.Function/WeatherForecast.Function/               


      # 🚀 Push the Docker image to ACR
      - name: 📤 Push Docker image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/$FUNCTION_IMAGE_NAME:$IMAGE_TAG

      # ⚙️ Deploy the container to Azure Function App
      - name: 🚀 Deploy Azure Function from Container Image
        run: |
          az functionapp config container set \
            --name $FUNCTION_APP_NAME \
            --resource-group $FUNCTION_APP_RESOURCE_GROUP \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/$FUNCTION_IMAGE_NAME:$IMAGE_TAG
           
      
      - name: 🔄 Restart Function App
        run: |
          az functionapp restart \
            --name $FUNCTION_APP_NAME \
            --resource-group $FUNCTION_APP_RESOURCE_GROUP      
        
