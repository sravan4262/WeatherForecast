name: Build, Test, and Push Docker Image to ACR

on:
  push:
    branches: [ main ]

env:
  # ACR Details (set these as GitHub Action secrets or Repository variables)
  # Example: ACR_LOGIN_SERVER: personalproject.azurecr.io
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }} # e.g., personalproject.azurecr.io
  WEBAPI_IMAGE_NAME: weatherforecast-webapi
  # Using Build ID as tag for unique versions, also pushing 'latest'
  IMAGE_TAG: ${{ github.sha }}
  # Function App Specific Environment Variables
  FUNCTION_APP_NAME: weatherforecastfunction # Your Azure Function App name
  FUNCTION_APP_RESOURCE_GROUP: personalproject # Your Function App's resource group
  FUNCTION_IMAGE_NAME: weatherforecast-function
  FUNCTION_DOCKERFILE_PATH: WeatherForecast.Function/Dockerfile # Path to your Function's Dockerfile

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🧪 Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 🛠️ Restore dependencies
      run: dotnet restore ./WeatherForecast/WeatherForecast.sln

    - name: 🧪 Run unit tests
      run: dotnet test ./WeatherForecast.Domain.UnitTests/WeatherForecast.Domain.UnitTests.csproj --no-build --verbosity normal

    - name: 🚀 Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: az acr login --name personalproject

    - name: Build Docker image
      run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/myapp:latest .

    - name: Push Docker image to ACR
      run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/myapp:latest
   
    - name: 🛠️ Set up kubectl and kubelogin
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_AKS }}    

    - name: 🛠️ Install kubelogin
      run: |
        az aks install-cli   

    - name: Set AKS credentials using Service Principal Token
      run: |
        # Get the kubeconfig (without trying to get an AAD token yet)
        # --admin will try to get static credentials, which is blocked by disabled local accounts.
        # However, it still outputs the basic cluster config (server, CA cert).
        # We redirect stderr to stdout and allow failure using '|| true' to capture all output.
        KUBECONFIG_CONTENT=$(az aks get-credentials \
            --resource-group personalproject \
            --name aks-personalproject-dev \
            --overwrite-existing \
            --admin 2>&1 || true)

        # Log the output to understand what 'az aks get-credentials' returns.
        # This is for debugging purposes; you might remove it once it works.
        echo "az aks get-credentials output:"
        echo "$KUBECONFIG_CONTENT"

        # Manually get an Azure AD access token for the Service Principal
        # This token is specifically for accessing the Kubernetes API
        # The resource URL is correct for Azure Management Plane, which AKS API is part of.
        ACCESS_TOKEN=$(az account get-access-token \
            --resource "https://management.azure.com/" \
            --query accessToken \
            --output tsv)

        # Log the token acquisition success (for debugging)
        echo "Successfully acquired Azure AD access token."

        # Extract the cluster name and context name using Azure CLI's default conventions.
        # This makes it more robust than hardcoding if names ever change slightly.
        CLUSTER_NAME="aks-personalproject-dev" # Based on your input
        RESOURCE_GROUP="personalproject" # Based on your input
        KUBECTL_USER_NAME="${CLUSTER_NAME}"
        KUBECTL_CONTEXT_NAME="aks_${RESOURCE_GROUP}_${CLUSTER_NAME}" # Standard convention

        echo "Updating kubeconfig for user: ${KUBECTL_USER_NAME} in context: ${KUBECTL_CONTEXT_NAME}"

        # Update the kubeconfig file with the obtained token
        # This sets the 'user' entry for your cluster to use the token.
        kubectl config set-credentials \
            "${KUBECTL_USER_NAME}" \
            --token="${ACCESS_TOKEN}"

        # Ensure the current context points to the updated user and cluster.
        kubectl config set-context \
            "${KUBECTL_CONTEXT_NAME}" \
            --user="${KUBECTL_USER_NAME}"

        echo "Kubeconfig updated with Service Principal token."

    - name: Replace image tag in deployment.yaml
      run: |
        sed -i "s|weatherforecast-webapi:latest|weatherforecast-webapi:${{ github.sha }}|g" deploy/deployment.yaml

    - name: Deploy to AKS
      run: kubectl apply -f deploy/deployment.yaml
  
  build-push-and-deploy-function:
    runs-on: ubuntu-latest    
    
    env:
      # Function App Specific Environment Variables
      FUNCTION_APP_NAME: weatherforecastfunction # Your Azure Function App name
      FUNCTION_APP_RESOURCE_GROUP: personalproject # Your Function App's resource group
      FUNCTION_DOCKERFILE_PATH: WeatherForecast.Function/Dockerfile # Path to your Function's Dockerfile
      FUNCTION_IMAGE_NAME: weatherforecast-function
      IMAGE_TAG: latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # --- Azure Login for Function App Job (using OpenID Connect) ---
      # This login is also sufficient for ACR authentication if configured correctly
      - name: 🚀 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: az acr login --name personalproject    

      # 🏗️ Build the Docker image for the Function App
      - name: 🛠️ Build Function App Docker image
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/$FUNCTION_IMAGE_NAME:$IMAGE_TAG \
            -f WeatherForecast.Function/WeatherForecast.Function/Dockerfile \
            ./WeatherForecast.Function/WeatherForecast.Function/               


      # 🚀 Push the Docker image to ACR
      - name: 📤 Push Docker image to ACR
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/$FUNCTION_IMAGE_NAME:$IMAGE_TAG

      # ⚙️ Deploy the container to Azure Function App
      - name: 🚀 Deploy Azure Function from Container Image
        run: |
          az functionapp config container set \
            --name $FUNCTION_APP_NAME \
            --resource-group $FUNCTION_APP_RESOURCE_GROUP \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/$FUNCTION_IMAGE_NAME:$IMAGE_TAG
           
      
      - name: 🔄 Restart Function App
        run: |
          az functionapp restart \
            --name $FUNCTION_APP_NAME \
            --resource-group $FUNCTION_APP_RESOURCE_GROUP      
          
